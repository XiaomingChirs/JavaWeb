<!DOCTYPE html>
<!有两个html，一个表示页面内容的开始,一个表示页面的结束-->
<html lang="en">  <!html 标签表示html的开始 lang="en"表示英文，标签分为两部分head，body-->
<head>  <!表示头部信息，一般有三种，title标签，css样式，js代码-->
    <!--<标签名>标签封装的数据</标签名>（结束标签前面有斜杠）    标签名大小写不敏感-->
    <!--标签有自己的属性，分为基本属性：可以简单地修改样式和效果，例如bgcolor背景颜色属性
    ，    和事件属性，可以直接设置事件相应后的代码，onclick表示点击事件，alert()是警告框可以提供接收任意的
    函数信息-->

    <!-- 标签格式分为单标签和双标签，单标签 <标签/>自结束,   双标签<标签>..封装的数据..</标签>  -->

    <!-- br换行，hr是水平线-->
    <meta charset="UTF-8">   <!表示当前页面用UTF-8 字符集-->
    <title>京东</title>
</head>
hello
明哥好牛<br/>你知道的
<hr/>
你知道很帅就行
<body bgcolor="#7fffd4" onclick="alert('life is good')"> <!body标签是整个HTML页面显示的内容-->

<button onclick="alert('明哥好帅')">

</button>
</body>

</html><!这里就是表示html的结束-->
