                ..表示当前文件所在的上一级目录
               文件名 表示当前文件所在目录的文件，相当于./文件名    ./ 可以省略
绝对路径： http：//ip:port/工程名/资源路径
 width ,height,border三种属性，alt属性设置当指定路径找不到图片时，用来代替显示的文本内容
